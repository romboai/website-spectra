<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none" role="img" aria-label="Natural-products research analogue ranking schematic">
  <rect width="480" height="200" fill="#fbfaf6"/>
  <g stroke="#dedad1" stroke-width="1">
    <line x1="0" y1="40" x2="480" y2="40"/>
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="120" x2="480" y2="120"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
  </g>
  <rect x="20" y="20" width="440" height="160" fill="#f4f2ec" stroke="#c8c3b8" stroke-width="1.2"/>
  <text x="34" y="38" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600" letter-spacing="1.2">SCAFFOLD NEIGHBOURHOOD · C15H10O6 ANALOGUE DISCRIMINATION</text>

  <!-- Bicyclic flavonoid core schematic -->
  <polygon points="56,82 80,68 104,82 104,110 80,124 56,110" fill="none" stroke="#1d1c1a" stroke-width="1.8"/>
  <polygon points="104,82 128,68 152,82 152,110 128,124 104,110" fill="none" stroke="#1d1c1a" stroke-width="1.8"/>
  <!-- B-ring -->
  <line x1="152" y1="82" x2="174" y2="70" stroke="#1d1c1a" stroke-width="1.8"/>
  <polygon points="174,70 198,58 218,72 218,98 194,110 174,96" fill="none" stroke="#1d1c1a" stroke-width="1.8"/>

  <!-- Highlight C-3 position -->
  <circle cx="152" cy="110" r="9" fill="#f97316" fill-opacity="0.22" stroke="#f97316" stroke-width="1.8"/>
  <line x1="152" y1="110" x2="168" y2="132" stroke="#f97316" stroke-width="1.8"/>
  <text x="148" y="146" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600">C-3 δC discriminator</text>
  <text x="48" y="164" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">3-OH (Flavonol) vs 3-H (Flavone)</text>

  <!-- Right comparison table -->
  <rect x="252" y="52" width="192" height="112" fill="#fbfaf6" stroke="#c8c3b8" stroke-width="1"/>
  <text x="264" y="70" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600">CANDIDATE      13C RMSD</text>
  <line x1="264" y1="76" x2="432" y2="76" stroke="#dedad1" stroke-width="1"/>
  <text x="264" y="94" fill="#1d1c1a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600">1 Quercetin     1.8 ppm</text>
  <text x="264" y="118" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">2 Luteolin      3.4 ppm</text>
  <text x="264" y="142" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">3 Kaempferol    4.1 ppm</text>
</svg>
