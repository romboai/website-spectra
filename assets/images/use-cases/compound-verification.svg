<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none" role="img" aria-label="NMR compound verification schematic">
  <rect width="480" height="200" fill="#fbfaf6"/>
  <g stroke="#dedad1" stroke-width="1">
    <line x1="0" y1="40" x2="480" y2="40"/>
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="120" x2="480" y2="120"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
  </g>
  <!-- Left card: Proposed structure -->
  <rect x="20" y="22" width="175" height="156" fill="#f4f2ec" stroke="#c8c3b8" stroke-width="1.2"/>
  <text x="32" y="40" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600" letter-spacing="1.2">PROPOSED STRUCTURE</text>
  <!-- Benzene ring para-substituted -->
  <polygon points="107,68 131,82 131,110 107,124 83,110 83,82" fill="none" stroke="#1d1c1a" stroke-width="1.8"/>
  <circle cx="107" cy="96" r="14" fill="none" stroke="#1d1c1a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="107" y1="50" x2="107" y2="68" stroke="#1d1c1a" stroke-width="1.8"/>
  <line x1="107" y1="124" x2="107" y2="142" stroke="#f97316" stroke-width="2.2"/>
  <line x1="107" y1="142" x2="93" y2="152" stroke="#f97316" stroke-width="2.2"/>
  <line x1="107" y1="142" x2="121" y2="152" stroke="#f97316" stroke-width="2.2"/>
  <text x="32" y="168" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">1,4-isomer · C10H14</text>

  <!-- Right panel: Shift residual verification -->
  <rect x="215" y="22" width="245" height="156" fill="#f4f2ec" stroke="#c8c3b8" stroke-width="1.2"/>
  <text x="227" y="40" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600" letter-spacing="1.2">13C SHIFT RESIDUAL CHECK</text>

  <!-- Row 1: Rank 1 -->
  <rect x="227" y="52" width="221" height="48" fill="#fbfaf6" stroke="#f97316" stroke-width="1.2"/>
  <text x="236" y="68" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">#1 p-Cymene (Proposed)</text>
  <text x="392" y="68" fill="#14532d" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600">SUPPORTED</text>
  <text x="236" y="86" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">13C RMSD 0.8 ppm · 6/6 C matched</text>

  <!-- Row 2: Competing isomer -->
  <rect x="227" y="108" width="221" height="48" fill="#fbfaf6" stroke="#c8c3b8" stroke-width="1"/>
  <text x="236" y="124" fill="#1d1c1a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">#2 m-Cymene (Isomer)</text>
  <text x="390" y="124" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">Δδ +4.1 ppm</text>
  <text x="236" y="142" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">C-2 / C-5 shifts contradict 1,3-pattern</text>
</svg>
