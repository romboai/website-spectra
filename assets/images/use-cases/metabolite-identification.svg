<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none" role="img" aria-label="Metabolite identification schematic">
  <rect width="480" height="200" fill="#fbfaf6"/>
  <g stroke="#dedad1" stroke-width="1">
    <line x1="0" y1="40" x2="480" y2="40"/>
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="120" x2="480" y2="120"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
  </g>
  <rect x="20" y="20" width="440" height="160" fill="#f4f2ec" stroke="#c8c3b8" stroke-width="1.2"/>
  <text x="34" y="38" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600" letter-spacing="1.2">BIOTRANSFORMATION · REGIOISOMER &amp; CONJUGATE RANKING</text>

  <!-- Left: Parent structure with candidate oxidation sites -->
  <polygon points="75,74 101,60 127,74 127,104 101,118 75,104" fill="none" stroke="#1d1c1a" stroke-width="1.8"/>
  <line x1="127" y1="74" x2="155" y2="60" stroke="#1d1c1a" stroke-width="1.8"/>
  <line x1="155" y1="60" x2="180" y2="74" stroke="#1d1c1a" stroke-width="1.8"/>

  <!-- Site A highlight -->
  <circle cx="75" cy="74" r="8" fill="#f97316" fill-opacity="0.25" stroke="#f97316" stroke-width="1.8"/>
  <text x="34" y="66" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600">Site A (+OH)</text>

  <!-- Site B highlight -->
  <circle cx="101" cy="118" r="8" fill="none" stroke="#9a3412" stroke-width="1.4" stroke-dasharray="2 2"/>
  <text x="72" y="142" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">Site B (+OH)</text>

  <text x="34" y="164" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">Parent +16 Da (MS known)</text>

  <!-- Right: Regioisomer 13C comparison -->
  <rect x="226" y="50" width="218" height="114" fill="#fbfaf6" stroke="#c8c3b8" stroke-width="1"/>
  <text x="238" y="68" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600">IPSO / ORTHO 13C SHIFT CHECK</text>
  <rect x="238" y="76" width="194" height="36" fill="#f4f2ec" stroke="#f97316" stroke-width="1.2"/>
  <text x="246" y="92" fill="#1d1c1a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600">#1 4'-OH Metabolite (Site A)</text>
  <text x="246" y="105" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5">δC 157.2 ppm fits ipso carbon (+28 ppm)</text>

  <rect x="238" y="118" width="194" height="36" fill="#f4f2ec" stroke="#c8c3b8" stroke-width="1"/>
  <text x="246" y="134" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">#2 3'-OH Metabolite (Site B)</text>
  <text x="246" y="147" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5">Residual 4.8 ppm at C-2' / C-6'</text>
</svg>
