<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none" role="img" aria-label="NMR impurity identification schematic">
  <rect width="480" height="200" fill="#fbfaf6"/>
  <g stroke="#dedad1" stroke-width="1">
    <line x1="0" y1="40" x2="480" y2="40"/>
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="120" x2="480" y2="120"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
  </g>
  <rect x="20" y="20" width="440" height="160" fill="#f4f2ec" stroke="#c8c3b8" stroke-width="1.2"/>
  <text x="34" y="38" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600" letter-spacing="1.2">MAJOR API COMPONENT + UNEXPECTED MINOR SIGNALS</text>

  <!-- Baseline -->
  <line x1="34" y1="152" x2="245" y2="152" stroke="#9e988d" stroke-width="1.2"/>
  <!-- Major API tall peaks -->
  <path d="M 40 152 L 70 152 L 76 48 L 82 152 L 180 152 L 186 52 L 192 152 L 240 152" stroke="#1d1c1a" stroke-width="1.8" fill="none"/>
  <text x="60" y="168" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">Known parent peaks</text>

  <!-- Minor impurity peaks inside zoom box -->
  <rect x="112" y="106" width="52" height="52" fill="none" stroke="#f97316" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M 122 152 L 126 130 L 130 152 L 142 152 L 146 126 L 150 152" stroke="#f97316" stroke-width="2" fill="none"/>

  <!-- Connector to zoom/hypotheses panel -->
  <line x1="164" y1="128" x2="262" y2="92" stroke="#f97316" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- Right inset: Impurity hypotheses -->
  <rect x="262" y="48" width="184" height="116" fill="#fbfaf6" stroke="#f97316" stroke-width="1.2"/>
  <text x="274" y="66" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600">EXTRA SIGNALS HYPOTHESES</text>
  <text x="274" y="88" fill="#1d1c1a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600">1. Des-methyl analogue</text>
  <text x="274" y="102" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5">Explains δH 7.12, δC 138.4 ppm</text>
  <text x="274" y="124" fill="#1d1c1a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="600">2. N-oxide degradant</text>
  <text x="274" y="138" fill="#65615b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5">2 carbons still unmatched</text>
  <text x="274" y="155" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5">→ Next: spike standard</text>
</svg>
