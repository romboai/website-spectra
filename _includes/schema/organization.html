<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ site.url }}/#organization",
      "name": {{ site.data.company.legal_name | jsonify }},
      "url": {{ site.data.company.url | jsonify }},
      "email": {{ site.data.company.email | jsonify }},
      "logo": "{{ site.url }}/assets/images/logo.png",
      "sameAs": [
        {{ site.data.company.github | jsonify }},
        {{ site.data.company.huggingface | jsonify }}
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "{{ site.data.company.address.line1 }}, {{ site.data.company.address.line2 }}",
        "postalCode": {{ site.data.company.address.postal_code | jsonify }},
        "addressLocality": {{ site.data.company.address.city | jsonify }},
        "addressCountry": "IT"
      }
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}/",
      "name": {{ site.title | jsonify }},
      "description": {{ site.description | jsonify }},
      "publisher": { "@id": "{{ site.url }}/#organization" },
      "inLanguage": "en"
    }
  ]
}
</script>
