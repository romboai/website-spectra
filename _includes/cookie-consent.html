{% if site.consent_required %}
<div class="cookie-banner" id="cookie-banner" hidden role="dialog" aria-label="Cookie preferences">
  <p>Optional analytics cookies. We do not send form fields or sample data. <a href="{{ '/cookies/' | relative_url }}">Cookie notice</a></p>
  <div class="cookie-banner-actions">
    <button type="button" data-consent="reject">Reject</button>
    <button type="button" data-consent="accept">Accept</button>
  </div>
</div>
{% endif %}
