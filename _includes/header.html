{% include cta-config.html %}
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" width="28" height="28" alt="">
      <span class="brand-name">Spectra</span>
      <span class="brand-by">by ROMBO AI</span>
    </a>
    <nav class="nav-desktop" aria-label="Primary">
      {% for item in site.data.navigation.primary %}
        <a href="{{ item.path | relative_url }}"{% if page.url == item.path or page.url contains item.path %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
    <a class="btn btn-primary header-cta" href="{{ primary_href }}" data-cta-src="header" data-analytics="cta_click" aria-label="Try Spectra">{{ primary_label }}</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-navigation" data-menu-toggle>Menu</button>
  </div>
  {% include mobile-navigation.html %}
</header>
