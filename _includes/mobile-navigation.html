{% include cta-config.html %}
<nav class="mobile-nav" id="mobile-navigation" aria-label="Mobile">
  {% for item in site.data.navigation.primary %}
    <a href="{{ item.path | relative_url }}">{{ item.label }}</a>
  {% endfor %}
  <a class="btn btn-primary" style="margin-top:1rem" href="{{ primary_href }}" data-analytics="try_spectra_clicked">{{ primary_label }}</a>
  <a class="btn btn-secondary" style="margin-top:0.6rem" href="{{ enterprise_href | relative_url }}" data-analytics="request_pilot_clicked">{{ enterprise_label }}</a>
</nav>
