{% include cta-config.html %}
<nav class="mobile-nav" id="mobile-navigation" aria-label="Mobile">
  {% for item in site.data.navigation.primary %}
    <a href="{{ item.path | relative_url }}">{{ item.label }}</a>
  {% endfor %}
  <a class="btn btn-primary" style="margin-top:1rem" href="{{ primary_href }}" data-cta-src="mobile_nav" data-analytics="cta_click">{{ primary_label }}</a>
  <a class="btn btn-secondary" style="margin-top:0.6rem" href="{{ '/pilot/' | relative_url }}" data-analytics="cta_click" data-cta-src="mobile_pilot">Talk to us</a>
</nav>
