- id: what-it-does
  question: What does Spectra do?
  answer: >-
    Spectra takes 1H and 13C NMR data, retrieves and ranks candidate structures,
    and shows the evidence for each: match value, residual error and per-shift
    agreement. It is a decision aid; the chemist makes the identification.
- id: which-data
  question: Which data can I upload?
  answer: >-
    1H and 13C spectra from Bruker, JEOL and Varian systems, or JCAMP-DX.
- id: replacement
  question: Does it replace Mnova, TopSpin or ACD/Labs?
  answer: >-
    No. Keep acquisition and processing where they are. Spectra is the ranking
    and evidence step after them.
- id: mixtures
  question: Is it only for pure compounds?
  answer: >-
    No. Spectra supports verification of knowns, dereplication of mixtures, and
    identification of unknowns. Mixtures, impurities and overlapping signals
    remain harder cases and may require additional experiments.
- id: libraries
  question: Does it only work with proprietary libraries?
  answer: >-
    No. Spectra combines large-scale compound libraries with foundation-model
    ranking and physics-guided validation. Customer-private libraries can be
    discussed for an enterprise agreement.
- id: unknown-vs-verify
  question: Does it do verification or also unknown identification?
  answer: >-
    Both. Verification of a proposed identity is usually the lower-risk path.
    Identification of an unknown is possible but carries more residual
    uncertainty and more often needs a next experiment.
- id: only-nmr
  question: Does it only use NMR?
  answer: >-
    Spectra is an NMR compound-identification agent. Primary inputs are 1H and
    13C data. Molecular formula, exact mass, MS or synthesis context may be
    supplied as additional context when available.
- id: hallucinations
  question: How do you avoid generative-model hallucinations?
  answer: >-
    Candidate generation is not treated as sufficient. Hypotheses are ranked
    against retrieved structures and then checked by comparing predicted and
    measured shifts. Candidates the data cannot support fall in rank or are
    discarded.
- id: confidence
  question: How is confidence in a result assessed?
  answer: >-
    Spectra surfaces a match value, 13C RMSD, and shift-level evidence.
    Confidence is conditional on the submitted data, the search space, and the
    quality of the spectrum. A high match is still a hypothesis until a chemist
    reviews it.
- id: regulated
  question: Is it suitable for regulated laboratories?
  answer: >-
    Spectra can support a documented review trail. Regulated use is scoped as
    an enterprise conversation, including method validation on your samples.
- id: time-to-value
  question: How long does it take to see value?
  answer: >-
    You can sign in and submit a spectrum. The fastest evaluations usually
    start with verification or dereplication on 1H and 13C datasets you already
    have. An enterprise agreement is scoped around a real case.
- id: chemist-in-control
  question: Who makes the final identification?
  answer: >-
    The chemist. Spectra produces a ranked shortlist and evidence. Final
    interpretation, reporting, and any quality or regulatory decision remain
    with the human expert.
- id: unpublished-data
  question: Can I upload client or unpublished spectra?
  answer: >-
    Sign in before any upload. Agree data-processing terms before a client
    sample or an unpublished structure: hosting, retention, training use,
    deletion and subprocessors. Email contact@rombo.ai for a review without
    attaching spectra or confidential project details. See security and data handling.
- id: pricing
  question: How much does Spectra cost?
  answer: >-
    Free includes 3 analyses and shift-level evidence. Pro is €79 per month
    or €790 per year for one user, with 20 analyses per month, advanced LLM
    models, higher-accuracy algorithms and physics-guided ranking. Enterprise
    is custom: talk to sales. VAT is confirmed before a purchase order. See
    the pricing page.
