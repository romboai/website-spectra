name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      LEAD_FORM_ENDPOINT: ${{ secrets.LEAD_FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
      - name: Quality checks
        run: bash scripts/qa.sh
