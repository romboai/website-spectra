---
layout: default
---
<article class="wrap page-hero">
  <header class="prose">
    {% include breadcrumbs.html %}
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.h1 | default: page.title }}</h1>
    {% if page.description %}<p class="page-lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="{% if page.wide %}wide-content{% else %}prose{% endif %}">
    {{ content }}
  </div>
</article>
