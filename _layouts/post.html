---
layout: default
---
<article class="wrap page-hero">
  <header class="prose">
    {% include breadcrumbs.html %}
    <p class="eyebrow">{{ page.date | date: "%d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
